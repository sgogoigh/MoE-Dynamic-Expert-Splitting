<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="960" height="440" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="34" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="800">Function-Preserving Expert Split Geometry &amp; State Migration</text>
  <text x="480" y="54" text-anchor="middle" fill="#475569" font-size="11.5">Why shifting bias by -tau_r * ln(2) keeps softmax mass invariant before/after cloning</text>

  <!-- Left: Before Split -->
  <rect x="28" y="76" width="380" height="334" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="28" y="76" width="380" height="34" rx="10" fill="#1e293b"/>
  <text x="218" y="98" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Step t- : Before Split</text>

  <rect x="48" y="128" width="340" height="106" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="218" y="149" text-anchor="middle" fill="#312e81" font-size="12.5" font-weight="700">Overloaded Donor Expert j*</text>
  <text x="64" y="170" fill="#1e293b" font-size="10.5">Router Logit: z_j* = (w_j*^T x + b_j*) / tau_r</text>
  <text x="64" y="188" fill="#1e293b" font-size="10.5">Unnorm Mass:  exp(z_j*)</text>
  <text x="64" y="206" fill="#4338ca" font-size="10.5" font-weight="600">EMA Load N_j* = 0.42   |   Energy S_j* = 3.80</text>
  <text x="64" y="222" fill="#475569" font-size="9.8">FFN Weights W_in, W_out, AdamW moments (m, v)</text>

  <rect x="48" y="252" width="340" height="82" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="218" y="274" text-anchor="middle" fill="#991b1b" font-size="12.5" font-weight="700">Dead Expert Slot j_dead</text>
  <text x="64" y="294" fill="#7f1d1d" font-size="10.5">EMA Load N_dead = 0.002  (&lt; 0.1 * K_r/E)</text>
  <text x="64" y="312" fill="#7f1d1d" font-size="10.5">Unnorm Mass: exp(z_dead) ~ 0   (starved slot)</text>

  <rect x="48" y="348" width="340" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="218" y="367" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="600">Softmax Denominator Before Split:</text>
  <text x="218" y="383" text-anchor="middle" fill="#0f172a" font-size="10.5" font-family="Consolas, monospace">Z_before = exp(z_j*) + sum_{k != j*, dead} exp(z_k)</text>

  <!-- Center Transition -->
  <line x1="414" y1="225" x2="520" y2="225" stroke="#10b981" stroke-width="3" marker-end="url(#arrowG)"/>
  <rect x="416" y="156" width="102" height="58" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="467" y="175" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="800">SPLIT OP</text>
  <text x="467" y="191" text-anchor="middle" fill="#047857" font-size="9.5">b - tau_r ln 2</text>
  <text x="467" y="205" text-anchor="middle" fill="#047857" font-size="9.5">+/- delta W_perp</text>

  <!-- Right: After Split -->
  <rect x="528" y="76" width="404" height="334" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
  <rect x="528" y="76" width="404" height="34" rx="10" fill="#065f46"/>
  <text x="730" y="98" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Step t+ : Immediately After Split</text>

  <rect x="546" y="124" width="368" height="96" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="730" y="144" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">Sibling 1 (Donor Retained j*)</text>
  <text x="562" y="163" fill="#1e293b" font-size="10.3">Bias: b_new = b_j* - tau_r * ln(2)</text>
  <text x="562" y="180" fill="#065f46" font-size="10.3" font-weight="700">Mass: exp((u_j* - tau_r*ln 2)/tau_r) = 0.5 * exp(z_j*)</text>
  <text x="562" y="197" fill="#334155" font-size="10">FFN: W + delta*W_perp  |  N = 0.21  |  cooldown = 2*M_split</text>
  <text x="562" y="212" fill="#475569" font-size="9.5">AdamW (m, v) preserved from donor</text>

  <rect x="546" y="232" width="368" height="96" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="730" y="252" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">Sibling 2 (Revived Child j_dead)</text>
  <text x="562" y="271" fill="#1e293b" font-size="10.3">Bias: b_new = b_j* - tau_r * ln(2), row w_j* + xi_r</text>
  <text x="562" y="288" fill="#065f46" font-size="10.3" font-weight="700">Mass: exp((u_j* - tau_r*ln 2)/tau_r) = 0.5 * exp(z_j*)</text>
  <text x="562" y="305" fill="#334155" font-size="10">FFN: W - delta*W_perp  |  N = 0.21  |  cooldown = 2*M_split</text>
  <text x="562" y="320" fill="#475569" font-size="9.5">AdamW v copied (stable step size); m copied/halved</text>

  <rect x="546" y="340" width="368" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="730" y="359" text-anchor="middle" fill="#1e3a8a" font-size="10.5" font-weight="700">Exact Conservation Property (at delta = 0):</text>
  <text x="730" y="376" text-anchor="middle" fill="#1e40af" font-size="10.2" font-family="Consolas, monospace">0.5*exp(z_j*) + 0.5*exp(z_j*) = exp(z_j*) =&gt; Z_after == Z_before</text>
</svg>
